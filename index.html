<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><title>মাসিক হাজিরা খাতা</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans Bengali",sans-serif;margin:0;background:#f4f7f8;color:#17323a}header{background:#0f766e;color:#fff;padding:15px;position:sticky;top:0}main{max-width:1000px;margin:auto;padding:10px}.card{background:#fff;margin:10px 0;padding:13px;border-radius:13px;box-shadow:0 2px 8px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.f{flex:1;min-width:150px}label{display:block;font-size:13px;font-weight:bold;margin:4px 0}input,select,button{width:100%;padding:10px;border:1px solid #ccd8db;border-radius:8px;font-size:15px}button{background:#0f766e;color:#fff;border:0;font-weight:bold}.save{background:#15803d;font-size:16px}.danger{background:#b42318;width:auto}.grid{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{border:1px solid #ddd;padding:6px;text-align:center}th{background:#edf5f4}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px}.box{background:#edf7f6;padding:9px;border-radius:8px}.box b{display:block;font-size:18px}.muted{font-size:13px;color:#60757b}.emp{padding:8px;border:1px solid #ddd;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}</style></head><body><header><b>মাসিক হাজিরা খাতা</b><br><small>হাজিরা • বেতন • অগ্রিম • ওভারটাইম</small></header><main><div class="card"><div class="row"><div class="f"><label>মাস</label><input id="month" type="month"></div><div class="f"><label>নাম</label><input id="name" placeholder="কর্মচারীর নাম"></div><div class="f"><label>মাসিক বেতন</label><input id="salary" type="number" placeholder="15000"></div><div class="f"><button onclick="addEmp()">কর্মচারী যোগ করুন</button></div></div></div><div class="card"><h3>কর্মচারীর তালিকা</h3><div id="emps"></div></div><div class="card"><div class="row"><div class="f"><label>হাজিরা মাস</label><input id="am" type="month"></div><div class="f"><label>কর্মচারী</label><select id="ae"></select></div></div><p class="muted">প্রতিটি দিন আগে নির্বাচন করুন। খালি থাকলে কোনো হাজিরা ধরা হবে না।</p><div id="days" class="grid"></div><button class="save" onclick="saveAtt()">হাজিরা সেভ করুন</button></div><div class="card"><h3>অগ্রিম / টাকা প্রদান</h3><div class="row"><div class="f"><label>কর্মচারী</label><select id="pe"></select></div><div class="f"><label>তারিখ</label><input id="pd" type="date"></div><div class="f"><label>টাকা</label><input id="pa" type="number"></div><div class="f"><label>নোট</label><input id="pn"></div><div class="f"><button onclick="pay()">টাকা সেভ করুন</button></div></div><div id="payments"></div></div><div class="card"><h3>মাসিক রিপোর্ট</h3><div id="report"></div></div></main><script>const K='HK4',D=JSON.parse(localStorage[K]||'{"e":[],"a":{},"p":{}}'),$=x=>document.getElementById(x),now=new Date(),YM=now.toISOString().slice(0,7);$('month').value=$('am').value=YM;$('pd').value=now.toISOString().slice(0,10);const O='<option value="">নির্বাচন করুন</option><option value="P">পূর্ণ দিন</option><option value="H">হাফ দিন</option><option value="PO">পূর্ণ দিন + OT</option><option value="HO">হাফ দিন + OT</option><option value="A">অনুপস্থিত</option><option value="L">ছুটি</option>';function save(){localStorage[K]=JSON.stringify(D)}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function days(m){let [y,x]=m.split('-').map(Number);return new Date(y,x,0).getDate()}function key(m,id){return m+'_'+id}function selects(){for(let q of ['ae','pe']){$(q).innerHTML='<option value="">কর্মচারী নির্বাচন করুন</option>'+D.e.map(e=>`<option value="${e.id}">${esc(e.n)} — ${e.s}৳</option>`).join('')}renderEmp();renderDays();report();}function addEmp(){let n=$('name').value.trim(),s=+($('salary').value||0);if(!n)return alert('নাম দিন');D.e.push({id:Date.now(),n,s});save();$('name').value=$('salary').value='';selects()}function renderEmp(){$('emps').innerHTML=D.e.map(e=>`<div class="emp"><span><b>${esc(e.n)}</b><br>${e.s.toLocaleString()} টাকা/মাস</span><button class="danger" onclick="del(${e.id})">মুছুন</button></div>`).join('')||'<span class="muted">কর্মচারী যোগ করুন।</span>'}function del(id){if(confirm('মুছে ফেলবেন?')){D.e=D.e.filter(e=>e.id!=id);save();selects()}}function renderDays(){let m=$('am').value,id=$('ae').value;if(!m||!id){$('days').innerHTML='<p class="muted">মাস ও কর্মচারী নির্বাচন করুন।</p>';return}let a=D.a[key(m,id)]||'',h='<table><tr><th>তারিখ</th><th>দিন</th><th>হাজিরা</th></tr>';for(let d=1;d<=days(m);d++){let dt=new Date(m+'-'+String(d).padStart(2,'0')+'T12:00:00'),wd=['রবি','সোম','মঙ্গল','বুধ','বৃহস্পতি','শুক্র','শনি'][dt.getDay()];h+=`<tr><td>${d}</td><td>${wd}</td><td><select data-d="${d}">${O}</select></td></tr>`}$('days').innerHTML=h+'</table>';document.querySelectorAll('#days select').forEach(s=>s.value=a[s.dataset.d]||'')}function saveAtt(){let m=$('am').value,id=$('ae').value;if(!m||!id)return alert('মাস ও কর্মচারী নির্বাচন করুন');let a={};document.querySelectorAll('#days select').forEach(s=>{if(s.value)a[s.dataset.d]=s.value});D.a[key(m,id)]=a;save();report();alert('হাজিরা সেভ হয়েছে')}function pay(){let id=$('pe').value,date=$('pd').value,v=+($('pa').value||0),n=$('pn').value;if(!id||!date||v<=0)return alert('সব তথ্য দিন');let k=key(date.slice(0,7),id);(D.p[k]??=[]).push({id:Date.now(),date,v,n});save();$('pa').value=$('pn').value='';renderPayments();report()}function renderPayments(){let id=$('pe').value,m=$('am').value,k=key(m,id),a=D.p[k]||[];$('payments').innerHTML=a.map(x=>`${x.date} — <b>${x.v.toLocaleString()}৳</b> ${esc(x.n||'')}`).join('<hr>')||'<span class="muted">কোনো টাকা প্রদান নেই।</span>'}function report(){let id=$('ae').value,m=$('am').value,e=D.e.find(x=>x.id==id);if(!e){$('report').innerHTML='';return}let a=D.a[key(m,id)]||{},f=0,h=0,ot=0,ab=0,l=0;Object.values(a).forEach(v=>{if(v=='P')f++;if(v=='H')h++;if(v=='PO'){f++;ot++}if(v=='HO'){h++;ot++}if(v=='A')ab++;if(v=='L')l++});let earned=e.s/days(m)*(f+h*.5),paid=(D.p[key(m,id)]||[]).reduce((x,y)=>x+y.v,0);$('report').innerHTML=`<b>${esc(e.n)}</b><div class="summary"><div class="box">পূর্ণ দিন<b>${f}</b></div><div class="box">হাফ দিন<b>${h}</b></div><div class="box">OT<b>${ot}</b></div><div class="box">অনুপস্থিত<b>${ab}</b></div><div class="box">ছুটি<b>${l}</b></div><div class="box">প্রাপ্য<b>${Math.round(earned).toLocaleString()}৳</b></div><div class="box">দেওয়া<b>${paid.toLocaleString()}৳</b></div><div class="box">বাকি<b>${Math.round(earned-paid).toLocaleString()}৳</b></div></div>`}$('am').onchange=()=>{renderDays();renderPayments();report()};$('ae').onchange=()=>{renderDays();report()};$('pe').onchange=renderPayments;$('month').onchange=()=>{$('am').value=$('month').value;renderDays();report()};selects();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
